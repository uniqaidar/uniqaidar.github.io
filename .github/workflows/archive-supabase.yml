name: Archive Supabase Stats

on:
  schedule:
    # Runs at 20:55 UTC daily (23:55 Sulaymaniyah, Asia/Baghdad UTC+3)
    # 5 minutes before midnight -- captures all of today's data
    - cron: '55 20 * * *'
  workflow_dispatch:
    # Allow manual trigger (e.g. if scheduled run missed)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Archive today's Supabase stats (with KV fallback)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STATS_URL: https://uniqaidar.pages.dev/api/stats
          ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
          PURGE_URL: https://uniqaidar.pages.dev/api/purge
          MAX_FILE_BYTES: 5000000
        run: |
          set -eo pipefail

          WORK_DIR="${GITHUB_WORKSPACE}"
          TODAY=$(TZ='Asia/Baghdad' date '+%Y-%m-%d')
          echo "Archiving data for: $TODAY (Sulaymaniyah time)"
          echo "Working directory: $WORK_DIR"

          # Write Python archiver script via base64 decode
          echo "" | base64 -d > /tmp/archive_supabase.py

          # Run archiver
          TODAY="$TODAY" \
          SUPABASE_URL="$SUPABASE_URL" \
          SUPABASE_SERVICE_KEY="$SUPABASE_SERVICE_KEY" \
          STATS_URL="$STATS_URL" \
          ARCHIVE_TOKEN="$ARCHIVE_TOKEN" \
          PURGE_URL="$PURGE_URL" \
          MAX_FILE_BYTES="$MAX_FILE_BYTES" \
          WORK_DIR="$WORK_DIR" \
          python3 /tmp/archive_supabase.py

          echo "Archive step completed"

      - name: Commit archived data
        if: success()
        run: |
          if [ -f "${GITHUB_WORKSPACE}/_no_data.flag" ]; then
            echo "No data to commit -- skipping."
            rm -f "${GITHUB_WORKSPACE}/_no_data.flag"
            exit 0
          fi

          git config user.name "UniQaidar Admin"
          git config user.email "uniqaidar@gmail.com"
          git add historicaldata/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            echo "Pushing changes..."
            git pull --rebase --autostash --strategy=recursive --strategy-option=theirs
            git commit -m "Auto-archive stats (Supabase): $(TZ='Asia/Baghdad' date '+%Y-%m-%d') -- $(TZ='Asia/Baghdad' date '+%H:%M') SUL"
            git push
            echo "Commit pushed successfully"
          fi

      - name: Clear source data after successful archive
        if: success()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
          PURGE_URL: https://uniqaidar.pages.dev/api/purge
        run: |
          if [ -f "${GITHUB_WORKSPACE}/_no_data.flag" ]; then
            exit 0
          fi

          TODAY=$(TZ='Asia/Baghdad' date '+%Y-%m-%d')
          SOURCE_FILE="${GITHUB_WORKSPACE}/_archive_source.txt"
          SOURCE=$(cat "$SOURCE_FILE" 2>/dev/null || echo "")
          rm -f "$SOURCE_FILE"

          echo "Clearing $SOURCE data for: $TODAY"

          if [ "$SOURCE" = "Supabase" ]; then
            echo "" | base64 -d > /tmp/delete_rows.py
            TODAY="$TODAY" \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_SERVICE_KEY="$SUPABASE_SERVICE_KEY" \
            python3 /tmp/delete_rows.py
          else
            curl -sf -X POST \
              --max-time 30 \
              -H "Authorization: Bearer ${ARCHIVE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"date\":\"${TODAY}\"}" \
              "${PURGE_URL}" && echo "KV purge successful" || echo "KV purge encountered an issue (non-blocking)"
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "Workflow failed. Check logs above for details."
          exit 1
